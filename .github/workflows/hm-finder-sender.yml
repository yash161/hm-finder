name: HM Finder scheduled sender

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: hm-finder-scheduled-sender
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/drain-gmail-queue.mjs
        env:
          GMAIL_USER: ${{ secrets.HM_FINDER_GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.HM_FINDER_GMAIL_APP_PASSWORD }}
